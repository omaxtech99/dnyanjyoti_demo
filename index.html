 return `${(sb||o.tools)?`<div class="tools">${sb}${o.tools||''}</div>`:''}${rows.length?`<div class="tw"><table id="${id}"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="tw">${empty(o.empty||'Nothing to show yet','Records will appear here when available.')}</div>`}`}

function fld(label,name,o={}){const t=o.type||'text',id='f_'+name+(o.uid||'');let inp;
 if(t==='select')inp=`<select name="${name}" id="${id}" ${o.req?'required':''}>${(o.opts||[]).map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${String(o.val)===String(v)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
 else if(t==='textarea')inp=`<textarea name="${name}" id="${id}" rows="${o.rows||4}" placeholder="${esc(o.ph||'')}" ${o.req?'required':''} ${o.minlen?`data-minlen="${o.minlen}"`:''}>${esc(o.val||'')}</textarea>`;

 return `<div class="f ${o.cls||''}"><label for="${id}">${esc(label)}${o.req?' *':''}</label>${inp}${o.hint?`<div class="hint">${esc(o.hint)}</div>`:''}</div>`}

function validate(f){let ok=true;$$('.ferr',f).forEach(e=>e.remove());$$('.f.err',f).forEach(e=>e.classList.remove('err'));
 $$('[required]',f).forEach(el=>{let msg='';let bad=!String(el.value||'').trim();if(bad)msg='This field is required.';
  const ml=+el.dataset.minlen;if(!bad&&ml&&el.value.trim().length<ml){bad=true;msg='Enter at least '+ml+' characters.'}
  if(!bad&&el.type==='number'&&el.min!==''&&+el.value<+el.min){bad=true;msg='Minimum value is '+el.min+'.'}
  if(!bad&&el.type==='email'&&!/^\S+@\S+\.\S+$/.test(el.value)){bad=true;msg='Enter a valid email address.'}
  if(bad){ok=false;const w=el.closest('.f');if(w){w.classList.add('err');w.insertAdjacentHTML('beforeend',`<div class="ferr" role="alert">${msg}</div>`)}}});
 if(!ok){const x=$('.err input,.err select,.err textarea',f);x&&x.focus()}return ok}

 m.addEventListener('mousedown',e=>{if(e.target===m)closeModal()});document.body.appendChild(m);const fi=$('input:not([type=hidden]),select,textarea',$('.mb',m));fi&&fi.focus()}

/* ---------- charts (inline SVG) ---------- */
const PAL=['#1d5fd1','#0e9384','#b8742a','#7a5bd1','#c4372c','#5b6b86'];
function lineChart(series,labels,o={}){const W=560,H=o.h||190,P={l:36,r:10,t:10,b:24};const all=series.flatMap(s=>s.vals);const mx=(Math.max(...all,1))*1.08,mn=o.min!=null?o.min:0;
 const x=i=>P.l+i*(W-P.l-P.r)/Math.max(labels.length-1,1),y=v=>P.t+(H-P.t-P.b)*(1-(v-mn)/((mx-mn)||1));
 let g='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,yy=y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="#e6ebf3"/><text x="${P.l-5}" y="${yy+3}" text-anchor="end">${o.fmt?o.fmt(v):Math.round(v)}</text>`}
 labels.forEach((l,i)=>{if(labels.length<=12||i%2===0)g+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${esc(l)}</text>`});
 series.forEach((s,k)=>{const c=s.color||PAL[k];g+=`<polyline fill="none" stroke="${c}" stroke-width="2.4" points="${s.vals.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+s.vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${c}"><title>${esc(s.name||'')} ${esc(labels[i])}: ${v}</title></circle>`).join('')});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Line chart')}">${g}</svg>${series.length>1?`<div class="leg">${series.map((s,k)=>`<span><i style="background:${s.color||PAL[k]}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}`}
function barChart(vals,labels,o={}){const W=560,H=o.h||190,P={l:36,r:10,t:10,b:24};const mx=Math.max(...vals,1)*1.1;const bw=(W-P.l-P.r)/vals.length;let g='';
 for(let i=0;i<=4;i++){const v=mx*i/4,yy=P.t+(H-P.t-P.b)*(1-i/4);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="#e6ebf3"/><text x="${P.l-5}" y="${yy+3}" text-anchor="end">${o.fmt?o.fmt(v):Math.round(v)}</text>`}
 vals.forEach((v,i)=>{const hh=(H-P.t-P.b)*v/mx,xx=P.l+i*bw+bw*.2;g+=`<rect x="${xx}" y="${H-P.b-hh}" width="${bw*.6}" height="${hh}" rx="3" fill="${(o.colors&&o.colors[i])||o.color||PAL[0]}"><title>${esc(labels[i])}: ${v}</title></rect><text x="${xx+bw*.3}" y="${H-7}" text-anchor="middle">${esc(labels[i])}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Bar chart')}">${g}</svg>`}
function donut(parts,o={}){const tot=sum(parts.map(p=>p.v))||1;let off=0;const R=42,C=2*Math.PI*R;const segs=parts.map((p,i)=>{const len=C*p.v/tot;const s=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${p.c||PAL[i]}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(p.l)}: ${p.v}</title></circle>`;off+=len;return s}).join('');
 return `<div class="row" style="gap:18px"><svg viewBox="0 0 120 120" width="130" height="130" role="img" aria-label="${esc(o.label||'Donut chart')}">${segs}<text x="60" y="64" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#0f1f3d">${o.center!=null?o.center:tot}</text></svg><div class="leg" style="flex-direction:column;gap:6px">${parts.map((p,i)=>`<span><i style="background:${p.c||PAL[i]}"></i>${esc(p.l)} — <b>${p.v}</b></span>`).join('')}</div></div>`}
function hbars(items,o={}){const mx=o.max||Math.max(...items.map(i=>i.v),1);return items.map(i=>`<div class="hb"><span>${esc(i.l)}</span><div class="bar"><i style="width:${Math.min(100,i.v/mx*100)}%;${i.c?`background:${i.c}`:''}"></i></div><b>${o.fmt?o.fmt(i.v):i.v}</b></div>`).join('')}

function seedNotes(){const W='Priya Sawant';return [
note('n1','Fundamental Rights — Overview','Polity','Fundamental Rights','English','Published',W,'# Fundamental Rights — Overview\nPart III of the Constitution (Articles 12–35) guarantees fundamental rights that are enforceable in courts.\n# Six categories\n- Right to Equality (Articles 14–18)\n- Right to Freedom (Articles 19–22)\n- Right against Exploitation (Articles 23–24)\n- Right to Freedom of Religion (Articles 25–28)\n- Cultural and Educational Rights (Articles 29–30)\n- Right to Constitutional Remedies (Article 32)\n# Exam tip\nDr. B. R. Ambedkar called Article 32 the "heart and soul" of the Constitution. Remember the five writs: Habeas Corpus, Mandamus, Prohibition, Certiorari and Quo Warranto.',{refs:'M. Laxmikanth, Indian Polity; Constitution of India (Part III)'}),
note('n2','The Revolt of 1857 — Causes and Consequences','History','Modern India','English','Published',W,'# The Revolt of 1857\nThe revolt began at Meerut on 10 May 1857 and spread across north and central India.\n# Major causes\n- Political: Doctrine of Lapse and annexation of princely states\n- Economic: heavy land revenue and decline of handicrafts\n- Military: grievances of sepoys, including the greased-cartridge issue\n# Consequences\n- The Government of India Act, 1858 ended East India Company rule\n- The Crown assumed direct control; Queen Victoria\'s Proclamation followed in November 1858\n- Reorganisation of the army and a changed policy towards princely states',{refs:'Bipan Chandra, India\'s Struggle for Independence'}),
note('n3','Inflation and Monetary Policy — Basics','Economy','Monetary Policy','English','Published',W,'# Inflation basics\nInflation is a sustained rise in the general price level. In India it is mainly tracked through the Consumer Price Index (CPI) and the Wholesale Price Index (WPI).\n# Monetary Policy Committee\n- Six members: three from the RBI and three external members\n- Inflation target: 4% with a tolerance band of ±2%\n# Key rates\n- Repo rate: rate at which the RBI lends short-term funds to banks\n- Reverse repo: rate at which the RBI absorbs liquidity from banks'),
note('n4','Indian Monsoon and Regional Rainfall Patterns','Geography','Climate','English','Published',W,'# The Indian monsoon\nThe south-west monsoon normally reaches Kerala around 1 June and covers the country by mid-July.\n# Regional patterns\n- The Western Ghats and the Konkan coast receive heavy orographic rainfall\n- Marathwada and interior Maharashtra lie in the rain-shadow region and receive much less\n- The monsoon withdraws from north-west India from September\n# Why it matters\nAgriculture, reservoir storage and rural incomes depend closely on monsoon performance.'),
note('n5','संत ज्ञानेश्वर आणि वारकरी संप्रदाय','History','Maharashtra Culture','Marathi','Published',W,'# संत ज्ञानेश्वर\nज्ञानेश्वरी ही भगवद्गीतेवरील मराठी भाषेतील टीका असून संत ज्ञानेश्वरांनी इ.स. १२९० च्या सुमारास ती लिहिली.\n# वारकरी संप्रदाय\n- पंढरपूरचा विठ्ठल हे वारकऱ्यांचे आराध्य दैवत आहे\n- संत नामदेव, संत एकनाथ, संत तुकाराम हे या संप्रदायातील प्रमुख संत\n- आषाढी आणि कार्तिकी वारी या प्रमुख यात्रा\n# परीक्षेसाठी मुद्दे\nसंत साहित्याचा मराठी भाषेच्या विकासातील वाटा नेहमी विचारला जातो.'),
note('n6','Percentages — Quick Calculation Techniques','Aptitude','Percentage','English','Published',W,'# Percentage shortcuts\n- x% of y equals y% of x, so 8% of 50 is the same as 50% of 8 = 4\n- Successive changes of a% and b% give a net change of a + b + (ab/100)%\n- To convert a fraction to a percentage, multiply by 100: 3/8 = 37.5%\n# Practice\nIf a price rises by 20% and then falls by 20%, the net change is 20 − 20 − 4 = −4%.'),
note('n7','Panchayati Raj — 73rd Constitutional Amendment','Polity','Local Government','English','DTP',W,'# Panchayati Raj\nThe 73rd Amendment Act, 1992 gave constitutional status to Panchayati Raj institutions.\n# Key features\n- Three-tier system: Gram Panchayat, Panchayat Samiti, Zilla Parishad\n- Reservation of seats for SC/ST and not less than one-third for women\n- Five-year term and State Election Commission\n- Eleventh Schedule lists 29 subjects',{at:now()-DAY,history:[{at:now()-DAY,who:W,act:'Submitted to DTP'}]}),
note('n8','Directive Principles of State Policy','Polity','DPSP','English','Technical Review',W,'# Directive Principles\nPart IV (Articles 36–51) contains the Directive Principles, which are non-justiciable but fundamental to governance.\n# Three broad groups\n- Socialistic principles\n- Gandhian principles\n- Liberal-intellectual principles\n# Example\nArticle 44 directs the State to endeavour to secure a Uniform Civil Code.',{at:now()-2*DAY}),
note('n9','Mansabdari System under the Mughals','History','Medieval India','English','Language Review',W,'# Mansabdari System\nIntroduced by Akbar, the system ranked officials by a numerical mansab.\n# Features\n- Two ranks: zat (personal rank) and sawar (cavalry obligation)\n- Appointments, promotions and dismissals were made by the emperor\n- Salaries were paid in cash or through jagirs',{versions:{mr:'# मनसबदारी पद्धत\nअकबराने सुरू केलेल्या या पद्धतीत अधिकाऱ्यांना मनसब नावाचा अंकात्मक दर्जा दिला जात असे.\n- झात (वैयक्तिक दर्जा) आणि सवार (घोडदळाची जबाबदारी)\n- नेमणूक, बढती आणि बडतर्फी बादशाह करीत असे',hi:'# मनसबदारी प्रथा\nअकबर द्वारा आरंभ की गई इस व्यवस्था में अधिकारियों को मनसब नामक संख्यात्मक पद दिया जाता था।\n- ज़ात (व्यक्तिगत पद) और सवार (घुड़सवार दायित्व)'},at:now()-3*DAY}),
note('n10','Union Budget — Basic Concepts','Economy','Public Finance','English','Subject Head Approval',W,'# Union Budget\nArticle 112 requires the Government to lay an Annual Financial Statement before Parliament.\n# Key terms\n- Revenue deficit: revenue expenditure minus revenue receipts\n- Fiscal deficit: total expenditure minus total receipts excluding borrowings\n- Primary deficit: fiscal deficit minus interest payments',{at:now()-4*DAY}),
note('n11','Soil Types of India','Geography','Soils','English','Draft',W,'# Soil types of India\nAlluvial soil is the most widespread soil group in India.\n# Others\n- Black soil: suited to cotton\n- Red soil: iron-rich, low in nitrogen',{rev:true,comment:'Reviewer: add laterite and desert soils, and cite the NCERT chapter.',history:[{at:now()-5*DAY,who:W,act:'Created'},{at:now()-DAY,who:'Prof. Anil Deshpande',act:'Changes requested'}],at:now()-5*DAY}),
note('n12','Major Rivers and Dams of Maharashtra','Geography','Maharashtra Geography','English','Publishing Queue',W,'# Rivers and dams\nThe Godavari, Krishna, Bhima and Tapi are the principal river systems of Maharashtra.\n# Notable projects\n- Jayakwadi Dam on the Godavari (Paithan)\n- Koyna Dam on the Koyna river, a major hydroelectric source\n- Ujani Dam on the Bhima',{at:now()-6*DAY})]}

  if(a===undefined||a===null||a===''){s++;sec.s++;weak[q.topic]=1;return}
  const ok=Number(a)===Number(q.ans);
  if(ok){c++;sec.c++;score+=test.marks;sec.score+=test.marks}else{w++;sec.w++;const pen=q.type==='num'?0:test.neg;score-=pen;sec.score-=pen;weak[q.topic]=1}});

function validateRow(r,rows,i){const e=[],q=r.question.trim();if(q.length<10)e.push('Question too short');['a','b','c','d'].forEach(k=>{if(!r[k].trim())e.push('Option '+k.toUpperCase()+' missing')});if(!/^[ABCD]$/i.test(r.answer.trim()))e.push('Answer must be A–D');if(!SUBJECTS.includes(r.subject.trim()))e.push('Unknown subject');if(!['Easy','Medium','Hard'].includes(r.difficulty.trim()))e.push('Difficulty must be Easy/Medium/Hard');
 if(S.questions.some(x=>x.text.trim().toLowerCase()===q.toLowerCase())||rows.some((o,j)=>j<i&&o.question.trim().toLowerCase()===q.toLowerCase()))e.push('Duplicate of existing question');return e}
function parseCSV(txt){const rows=[];let cur=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'&&txt[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){cur.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;cur.push(f);f='';if(cur.some(x=>x.trim()))rows.push(cur);cur=[]}else f+=c}if(f||cur.length){cur.push(f);rows.push(cur)}return rows}

V['examcontroller/dashboard']=()=>{const c=s=>S.tests.filter(t=>t.status===s).length;return ph('Welcome, '+ECN,'Exam Controller',btn('Create examination','go',{v:'create'},'pri','plus'))+`<div class="grid g4">${kpi('Published',c('Published'),'Live to students','send')}${kpi('Drafts / scheduled',c('Draft')+c('Scheduled'),'','edit')}${kpi('Approved questions',approvedQ().length,'Available in bank','list')}${kpi('Attempts recorded',S.attempts.length,'Shared data','clip')}</div><div class="grid g2 mt">${card('Examinations',tbl('ed',['Exam','Status','Questions','Date'],S.tests.map(t=>[`<b>${esc(t.name)}</b>`,badge(t.status),t.qids.length,fmtD(t.date)]),{search:false}),btn('Open builder','go',{v:'builder'},'sm'))}${card('Recently approved questions',approvedQ().slice(-5).reverse().map(q=>`<div class="sm" style="padding:6px 0;border-bottom:1px solid #eef1f6">${esc(q.text.slice(0,70))} <span class="mut">· ${q.id}</span></div>`).join(''))}</div>`};
V['examcontroller/create']=p=>{const tp=p.tpl?TPLS().find(x=>x.id===p.tpl):null,aq=approvedQ();return ph('Create Examination',tp?'From template: '+esc(tp.name):'Define a mock examination and pick questions from the approved bank')+`<div class="card"><div class="cb"><form data-form="exam" novalidate>${fld('Exam name','name',{req:true,minlen:5,val:tp?tp.name.replace(/ — .*/,'')+' Mock Test':''})}<div class="fg">${fld('Exam category','cat',{type:'select',opts:S.cats.filter(c=>c.active).map(c=>c.id),val:tp?tp.cat:'MPSC'})}${fld('Duration (minutes)','dur',{type:'number',req:true,min:5,val:tp?tp.dur:30})}${fld('Marks per question','marks',{type:'number',step:'0.5',req:true,min:.5,val:tp?tp.marks:2})}${fld('Negative marking (per wrong MCQ)','neg',{type:'number',step:'0.01',req:true,min:0,val:tp?tp.neg:0.5})}${fld('Exam date','date',{type:'date',req:true,val:new Date(now()+3*DAY).toISOString().slice(0,10)})}</div>
 <div class="f"><label>Eligible batches</label><div class="row">${chks('batches',S.batches.filter(b=>b.id!=='b8a').map(b=>[b.id,b.name]),['b2a'])}</div></div>
 <div class="f"><label>Add questions from the approved bank (${aq.length} available)</label><div class="tw" style="max-height:260px;overflow:auto;padding:8px 12px">${aq.map(q=>`<label class="chk"><input type="checkbox" name="qids" value="${q.id}"> <span><b>${q.id}</b> · ${esc(q.text.slice(0,90))} <span class="mut">(${q.sub} · ${q.diff})</span></span></label>`).join('')}</div></div>
 <button class="btn pri">Create draft exam</button></form></div></div>`};
FORM.exam=o=>{const q=arr(o.qids),b=arr(o.batches);if(!b.length){toast('Select at least one eligible batch','bad');return}if(!q.length){toast('Add at least one question','bad');return}const t={id:'t'+(10+S.tests.length),name:o.name,cat:o.cat,dur:+o.dur,marks:+o.marks,neg:+o.neg,batches:b,date:new Date(o.date).getTime(),status:'Draft',qids:q,resultsPublished:false,keyPublished:false,by:ECN,desc:q.length+' questions'};S.tests.push(t);log('Created exam '+t.name);save();toast('Draft created','ok');UI.f.bt=t.id;go('builder',{tid:t.id})};
V['examcontroller/templates']=()=>ph('Exam Templates')+tbl('et',['Template','Category','Duration','Marking','Action'],TPLS().map(t=>[`<b>${esc(t.name)}</b>`,t.cat,t.dur+' min','+'+t.marks+' / −'+t.neg,btn('Use template','go',{v:'create',p:JSON.stringify({tpl:t.id})},'sm pri')]),{search:false});
V['examcontroller/builder']=p=>{const id=p.tid||F('bt',S.tests[0].id),t=testOf(id)||S.tests[0],ed=['Draft','Scheduled'].includes(t.status),aq=approvedQ().filter(q=>!t.qids.includes(q.id));
 return ph('Question Paper Builder','Assemble, preview, schedule and publish')+`<div class="tools"><select data-chg="setf" data-id="bt" aria-label="Choose exam">${S.tests.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(x.name)} (${x.status})</option>`).join('')}</select>${btn('Preview paper','prevPaper',{id:t.id},'','eye')}${ed?btn(t.status==='Draft'?'Schedule exam':'Publish mock exam','pubTest',{id:t.id,k:t.status==='Draft'?'Scheduled':'Published'},'pri','send'):badge(t.status)}${ed&&t.status==='Scheduled'?btn('Back to draft','pubTest',{id:t.id,k:'Draft'}):''}</div>
 <div class="grid g4" style="margin-bottom:14px">${kpi('Questions',t.qids.length,'','list')}${kpi('Total marks',paperMarks(t),'+'+t.marks+' each','award')}${kpi('Negative marking','−'+t.neg,'MCQ only','alert')}${kpi('Duration',t.dur+' min','','clock')}</div>
 <div class="grid g2">${card('In this paper',tbl('ip',['ID','Question','Section',''],t.qids.map(i=>qOf(i)).filter(Boolean).map(q=>[q.id,esc(q.text.slice(0,60)),q.sec,ed?btn('Remove','rmQ',{t:t.id,q:q.id},'sm bad'):'']),{search:false,empty:'No questions added'}))}${card('Approved bank',tbl('ab',['ID','Question','Subject',''],aq.map(q=>[q.id,esc(q.text.slice(0,60)),q.sub,ed?btn('Add','addQ',{t:t.id,q:q.id},'sm pri'):'']),{empty:'All approved questions are already in this paper'}))}</div>`};
ACT.addQ=d=>{testOf(d.t).qids.push(d.q);save();rv()};ACT.rmQ=d=>{const t=testOf(d.t);t.qids=t.qids.filter(x=>x!==d.q);save();rv()};
ACT.prevPaper=d=>{const t=testOf(d.id);modal('Paper preview — '+t.name,`<p class="sm mut">${t.dur} min · ${paperMarks(t)} marks · −${t.neg} per wrong MCQ</p>`+t.qids.map(qOf).filter(Boolean).map((q,i)=>`<div style="padding:8px 0;border-bottom:1px solid #eef1f6"><b>Q${i+1}.</b> ${esc(q.text)} <span class="badge">${q.sec}</span>${q.opts?`<div class="sm mut">${q.opts.map((o,j)=>'ABCD'[j]+') '+esc(o)).join(' &nbsp; ')}</div>`:'<div class="sm mut">Numerical answer</div>'}</div>`).join(''),{wide:true})};
ACT.pubTest=d=>{const t=testOf(d.id);if(d.k!=='Draft'&&!t.qids.length){toast('Add questions first','bad');return}t.status=d.k;if(d.k==='Published'){t.date=now();notify('student','New mock test available: '+t.name,'tests');notify('management','Mock exam published: '+t.name,'exams');log('Published '+t.name)}if(d.k==='Scheduled')log('Scheduled '+t.name);save();toast(d.k==='Published'?'Published — students can attempt it now':'Status: '+d.k,'ok');rv()};
V['examcontroller/calendar']=()=>{const n=new Date(),y=n.getFullYear(),m=n.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();let cells='';['S','M','T','W','T','F','S'].forEach(x=>cells+=`<div class="d h">${x}</div>`);for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=dim;d++){const ev=S.tests.filter(t=>{const x=new Date(t.date);return x.getFullYear()===y&&x.getMonth()===m&&x.getDate()===d});cells+=`<div class="d" ${d===n.getDate()?'style="border-color:var(--blue)"':''}><b>${d}</b>${ev.map(e=>`<div class="ev" title="${esc(e.name)}">${esc(e.name)}</div>`).join('')}</div>`}
 return ph('Exam Calendar',n.toLocaleString('en-IN',{month:'long',year:'numeric'}))+`<div class="cal">${cells}</div><div class="mt"></div>`+tbl('ec',['Exam','Date','Status','Batches'],S.tests.map(t=>[esc(t.name),fmtD(t.date),badge(t.status),esc(t.batches.map(batchName).join(', '))]),{search:false})};
V['examcontroller/monitor']=()=>{const pub=S.tests.filter(t=>t.status==='Published'),t=testOf(F('mt',pub[0]&&pub[0].id))||pub[0];if(!t)return ph('Live Exam Monitoring')+empty('No exam is live','Publish an exam to monitor it','activity');
 const real=S.attempts.filter(a=>a.testId===t.id).length+(EX&&EX.testId===t.id?1:0);return ph('Live Exam Monitoring','Simulated active attempts — not real infrastructure monitoring')+`<div class="note" style="margin-bottom:12px">Illustrative simulation. Counts below are generated randomly in your browser; only the “recorded attempts” figure reflects shared demo data.</div><div class="tools"><select data-chg="setf" data-id="mt">${pub.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${btn('Close exam','closeExam',{id:t.id},'bad','x')}</div><div class="grid g4">${kpi('Active attempts (sim)','<span id="mA">—</span>','','users')}${kpi('Submitted (sim)','<span id="mS">—</span>','','check')}${kpi('Recorded attempts (shared)',real,'Real demo records','clip')}${kpi('Flags (sim)','<span id="mF">0</span>','Tab-switch warnings','alert')}</div><div class="mt">${card('Progress by section (simulated)',`<div id="mBars"></div>`)}</div>`};
V['dyn:examcontroller/monitor']=()=>{const base={a:180+Math.floor(Math.random()*40),s:30};const upd=()=>{base.a=Math.max(60,base.a+Math.floor(Math.random()*21)-12);base.s+=Math.floor(Math.random()*4);const a=$('#mA');if(!a)return;a.textContent=base.a;$('#mS').textContent=base.s;$('#mF').textContent=Math.floor(base.a/40);$('#mBars').innerHTML=hbars([{l:'General Studies',v:Math.round(40+Math.random()*30)},{l:'Aptitude',v:Math.round(30+Math.random()*30)},{l:'Reasoning',v:Math.round(35+Math.random()*30)}],{max:100,fmt:v=>v+'%'})};upd();every(upd,2500)};
ACT.closeExam=d=>confirmDlg('Close this exam? Students will no longer be able to start new attempts.',()=>{testOf(d.id).status='Closed';save();toast('Exam closed','ok');rv()},'Close exam',true);
const cohortOf=t=>{const c=ens('cohort',{});return c[t.id]};
V['examcontroller/rankings']=()=>{const t=testOf(F('rt',S.tests.find(x=>S.attempts.some(a=>a.testId===x.id)||x.status!=='Draft').id));const real=S.attempts.filter(a=>a.testId===t.id).map(a=>({n:'Aarav Patil (demo student)',s:a.score,m:a.max,real:true}));const co=(cohortOf(t)||[]).map(x=>({n:x.n,s:x.s,m:paperMarks(t)}));const all=[...real,...co].sort((a,b)=>b.s-a.s);
 return ph('Results & Rankings','Sample results are generated for demonstration')+`<div class="tools"><select data-chg="setf" data-id="rt">${S.tests.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${btn('Generate sample results','genRes',{id:t.id},'','refresh')}${t.resultsPublished?badge('Results published','ok'):btn('Publish results','pubRes',{id:t.id},'pri','send')}</div>${tbl('rk',['Rank','Candidate','Score','%'],all.map((r,i)=>[i+1,esc(r.n)+(r.real?' '+badge('Live demo record','info'):''),r.s,Math.round(100*r.s/(r.m||1))+'%']),{empty:'No results yet — students attempt the test or generate sample results'})}`};
ACT.genRes=d=>{const t=testOf(d.id),n=['Sakshi Kadam','Omkar Jagtap','Riya Chavan','Tanmay Gaikwad','Neha Shinde','Yash Mane','Pranjal Thakur','Harsh Biradar','Mayuri Salunkhe','Isha Menon'],mx=paperMarks(t);ens('cohort',{})[t.id]=n.map(x=>({n:x,s:Math.round(mx*(.25+Math.random()*.6)*2)/2}));save();toast('Sample results generated (illustrative)','ok');rv()};
ACT.pubRes=d=>{const t=testOf(d.id);t.resultsPublished=true;notify('student','Results published: '+t.name,'results');save();toast('Results published','ok');rv()};
V['examcontroller/keys']=()=>{const t=testOf(F('kt',S.tests[0].id));return ph('Answer Keys')+`<div class="tools"><select data-chg="setf" data-id="kt">${S.tests.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${t.keyPublished?badge('Key published','ok'):btn('Publish answer key','pubKey',{id:t.id},'pri','send')}</div>`+tbl('ky',['#','Question','Correct answer','Explanation'],t.qids.map(qOf).filter(Boolean).map((q,i)=>[i+1,esc(q.text.slice(0,70)),q.opts?'ABCD'[q.ans]+') '+esc(q.opts[q.ans]):q.ans,`<span class="sm">${esc(q.expl)}</span>`]),{search:false})};
ACT.pubKey=d=>{testOf(d.id).keyPublished=true;save();toast('Answer key published','ok');rv()};
V['examcontroller/reports']=()=>{const pa=S.tests.map(t=>({l:t.name.slice(0,26),v:S.attempts.filter(a=>a.testId===t.id).length+((cohortOf(t)||[]).length)}));return ph('Exam Reports','Includes illustrative sample cohorts where generated')+`<div class="grid g2">${card('Participation by exam',hbars(pa,{max:Math.max(10,...pa.map(x=>x.v))}))}${card('Average score % (recorded attempts)',barChart(S.tests.map(t=>{const a=S.attempts.filter(x=>x.testId===t.id);return a.length?Math.round(avg(a.map(x=>100*x.score/x.max))):0}),S.tests.map(t=>t.id),{fmt:v=>Math.round(v)+'%'}))}${card('Questions by difficulty',donut(['Easy','Medium','Hard'].map((d,i)=>({l:d,v:S.questions.filter(q=>q.diff===d&&q.status==='Approved').length,c:['#0e9384','#1d5fd1','#c4372c'][i]}))))}${card('Question status',donut(['Approved','Submitted','Draft','Returned'].map((s,i)=>({l:s,v:S.questions.filter(q=>q.status===s).length}))))}</div>`};

V['courseadmin/enroll']=()=>ph('Enrollments & Transfers','',btn('Enroll student','newEnroll',{},'pri','plus'))+tbl('en',['ID','Student','Course','Batch','Action'],ENR().map(e=>[e.id,`<b>${esc(e.name)}</b>`,esc(courseOf(e.cid).name),esc(batchName(e.batch)),btn('Transfer','xfer',{id:e.id},'sm','swap')]));
ACT.newEnroll=()=>formModal('Enroll student','enroll',fld('Student name','name',{req:true,minlen:3,ph:'Aarav Patil'})+fld('Course','cid',{type:'select',opts:S.courses.map(c=>[c.id,c.name])})+`<p class="sm mut">The first batch of the selected course is used.</p>`,{submit:'Enroll'});

function perfOf(name){if(name===SN){const a=myAttempts();return {tests:a.length,avg:a.length?Math.round(avg(a.map(x=>100*x.score/x.max))):0,weak:[...new Set(a.flatMap(x=>x.weak))].slice(0,4)}}const s=STUDENTS.find(x=>x.name===name);return {tests:3,avg:s?s.avg:50,weak:['Time management','CSAT accuracy'].slice(0,s&&s.avg<55?2:1)}}
V['counselor/students']=p=>{if(p.sid){const s=STUDENTS.find(x=>x.id===p.sid),pf=perfOf(s.name);CRUMB=s.name;return `${btn('Back','go',{v:'students'},'sm ghost','back')}<div class="ph mt"><div><h1>${esc(s.name)}</h1><p>${s.id} · ${esc(batchName(s.batch))}</p></div><div class="row">${btn('Add private note','addCN',{n:s.name},'','lock')}${btn('Create improvement plan','newPlan',{n:s.name},'pri','target')}${btn('Schedule follow-up','newFU',{n:s.name},'','clock')}</div></div><div class="grid g4">${kpi('Average score',pf.avg+'%','Mock tests','chart')}${kpi('Tests attempted',pf.tests,'','clip')}${kpi('Attendance',s.att+'%','','check')}${kpi('Weak topics',pf.weak.length,pf.weak.join(', ')||'—','alert')}</div><div class="grid g2 mt">${card('Sessions',S.appts.filter(a=>a.student===s.name).map(a=>`<div style="padding:6px 0;border-bottom:1px solid #eef1f6"><b>${fmtD(a.at)} ${a.slot}</b> ${badge(a.status)}<div class="sm mut">${esc(a.topic)}</div></div>`).join('')||'<p class="mut">No sessions yet.</p>')}${card('Private notes',S.cnotes.filter(n=>n.student===s.name).map(n=>`<div style="padding:6px 0;border-bottom:1px solid #eef1f6"><div class="sm mut">${fmtD(n.at)}</div>${esc(n.text)}</div>`).join('')||'<p class="mut">No notes yet.</p>')}</div>`}
 return ph('Assigned Students')+tbl('cs',['Student','Batch','Avg score','Attendance','Sessions','Action'],STUDENTS.slice(0,6).map(s=>[`<b>${esc(s.name)}</b><div class="sm mut">${s.id}</div>`,esc(batchName(s.batch)),perfOf(s.name).avg+'%',s.att+'%',S.appts.filter(a=>a.student===s.name).length,btn('Review','go',{v:'students',p:JSON.stringify({sid:s.id})},'sm pri')]))};

V['management/enroll']=()=>ph('Enrollment & Revenue')+mgmtBar()+`<div class="grid g2">${card('Enrolments by course',hbars(S.courses.filter(c=>c.id!=='c8').map(c=>({l:c.name.slice(0,22),v:Math.round(c.students*mfF()*(MF().cat==='All'||c.cat===MF().cat?(MF().cat==='All'?.25:1):0.0))+S.myCourses.filter(m=>m.cid===c.id).length})),{}))}${card('Revenue by month (₹ lakh)',barChart(ser(65,5),mLabels(),{fmt:v=>Math.round(v)}))}${card('Recorded transactions (live demo data)',`<div class="stat"><div class="c"><b>${S.txns.length}</b>Transactions</div><div class="c"><b>${inr(sum(okTx().map(t=>t.amt)))}</b>Mock value</div><div class="c"><b>${S.myCourses.length}</b>Demo student courses</div></div>`)}${card('Drop-off by stage',donut([{l:'Active',v:71},{l:'Paused',v:14},{l:'Dropped',v:15}]))}</div>`;
V['management/academic']=()=>ph('Academic Performance')+mgmtBar()+`<div class="grid g2">${card('Batch performance (avg score %)',hbars(S.batches.filter(b=>b.cap<9000).map((b,i)=>({l:b.name.slice(0,24),v:Math.round(52+14*Math.abs(Math.sin(i*1.4+MF().cat.length)))})),{max:100,fmt:v=>v+'%'}))}${card('Attendance trend',lineChart([{name:'Attendance %',vals:mLabels().map((l,i)=>Math.round(78+10*Math.abs(Math.sin(i*1.1+2))))}],mLabels(),{min:60,fmt:v=>Math.round(v)+'%'}))}</div><div class="mt">${card('Teacher performance',tbl('tp2',['Faculty','Sessions','Avg attendance','Student rating'],[['Dr. Meera Kulkarni',S.classes.filter(c=>c.fac===FN).length+Math.round(18*mfF()),'89%','4.8'],['Prof. Vivek Joshi',Math.round(16*mfF())+S.classes.filter(c=>c.fac==='Prof. Vivek Joshi').length,'86%','4.7'],['Ms. Anjali Deshmukh',Math.round(14*mfF())+1,'84%','4.6'],['Dr. Smita Phadke',Math.round(12*mfF()),'91%','4.7']].map(r=>r.map(x=>esc(String(x)))),{search:false}))}</div>`;
V['management/exams']=()=>{const pub=S.notes.filter(n=>n.stage==='Published').length;return ph('Exams & Content')+mgmtBar()+`<div class="grid g2">${card('Exam participation',barChart(ser(900,7).map((v,i,a)=>i===a.length-1?v+realAtt():v),mLabels(),{label:'Exam participation'})+`<p class="sm mut">Latest period includes ${realAtt()} live demo attempt(s) from the Student role.</p>`)}${card('Content team output (items per period)',lineChart([{name:'Notes',vals:ser(18,2),color:'#1d5fd1'},{name:'Questions',vals:ser(60,4),color:'#0e9384'}],mLabels()))}${card('Content status (live)',`<div class="stat"><div class="c"><b>${pub}</b>Notes published</div><div class="c"><b>${S.notes.filter(n=>!['Published','Rejected','Draft'].includes(n.stage)).length}</b>In workflow</div><div class="c"><b>${S.questions.filter(q=>q.status==='Approved').length}</b>Approved Qs</div></div>`)}${card('Tests',tbl('mt2',['Test','Status','Attempts (live)'],S.tests.map(t=>[esc(t.name),badge(t.status),S.attempts.filter(a=>a.testId===t.id).length]),{search:false}))}</div>`};
V['management/admiss']=()=>{const c=s=>S.leads.filter(l=>l.status===s).length,ap=S.appts;return ph('Admissions & Counseling')+mgmtBar()+`<div class="grid g2">${card('Admissions funnel (live leads + illustrative base)',hbars(LST.map((s,i)=>({l:s,v:c(s)+Math.round([380,260,170,90,60,70][i]*mfF())})),{}))}${card('Counseling outcomes',donut([{l:'Completed',v:ap.filter(a=>a.status==='Completed').length+Math.round(40*mfF())},{l:'Upcoming',v:ap.filter(a=>['Confirmed','Requested','Rescheduled'].includes(a.status)).length+Math.round(12*mfF())},{l:'Cancelled',v:ap.filter(a=>a.status==='Cancelled').length+Math.round(5*mfF())}]))}${card('Lead sources (live)',hbars([...new Set(S.leads.map(l=>l.src))].map(s=>({l:s,v:S.leads.filter(l=>l.src===s).length})),{max:5}))}</div>`};

/* ---------- OPERATIONS ---------- */
const SVC=['Web application','API gateway','Exam engine','Video delivery','Notification service','Database cluster'];
V['operations/dashboard']=()=>ph('Platform Health','Simulated operational states — not a real monitoring system')+`<div class="note" style="margin-bottom:14px">All values here are generated for demonstration. They do not reflect real infrastructure.</div><div class="grid g3">${SVC.map((s,i)=>card(s,`<div class="row sp">${badge(i===3&&S.incidents.some(x=>x.svc==='Video delivery'&&x.status!=='Resolved')?'Degraded':'Operational')}<span class="sm mut">latency <b id="lat${i}">—</b> ms (sim)</span></div>${prog(95+i*.7,'t')}`)).join('')}</div><div class="grid g2 mt">${card('Open incidents (simulated)',S.incidents.filter(i=>i.status!=='Resolved').map(i=>`<div class="row sp" style="padding:6px 0"><div><b>${esc(i.title)}</b><div class="sm mut">${esc(i.svc)}</div></div>${badge(i.sev)}</div>`).join('')||'<p class="mut">No open incidents.</p>',btn('Manage','go',{v:'incidents'},'sm'))}${card('Live classes now',`<p class="b" style="font-size:22px">${S.classes.filter(c=>c.status==='Live').length}</p><p class="sm mut">Simulated sessions started by faculty in this demo.</p>`)}</div>`;
V['dyn:operations/dashboard']=()=>{const u=()=>SVC.forEach((s,i)=>{const e=$('#lat'+i);if(e)e.textContent=Math.round(60+i*25+Math.random()*40)});u();every(u,2500)};
V['operations/exams']=()=>ph('Scheduled Exams','From shared demo data')+tbl('oe',['Exam','Date','Status','Readiness check (sim)'],S.tests.map(t=>[`<b>${esc(t.name)}</b>`,fmtD(t.date),badge(t.status),t.qids.length?badge('Paper ready','ok'):badge('Paper empty','bad')]));
V['operations/streams']=()=>ph('Live Stream Status','Simulated status for demo sessions — no real streaming')+tbl('ls',['Session','Status','Viewers (sim)','Bitrate (sim)','Recording'],S.classes.filter(c=>c.status!=='Scheduled'||c.at<now()+DAY).map(c=>[esc(c.title),badge(c.status),c.status==='Live'?Object.values(c.att).filter(Boolean).length+10:'—',c.status==='Live'?'2.4 Mbps':'—',esc(c.recording)]),{empty:'No sessions'});
V['operations/incidents']=()=>ph('Incidents','Simulated incident tracker',btn('Log incident','newInc',{},'pri','plus'))+tbl('ic',['Incident','Service','Severity','Status','Opened','Action'],S.incidents.map(i=>[`<b>${esc(i.title)}</b>`,esc(i.svc),badge(i.sev),badge(i.status),fmtDT(i.at),i.status==='Resolved'?'':btn(i.status==='Open'?'Acknowledge':'Resolve','incAct',{id:i.id},'sm pri')]));
ACT.newInc=()=>formModal('Log simulated incident','inc',fld('Title','title',{req:true,minlen:5})+fld('Service','svc',{type:'select',opts:SVC})+fld('Severity','sev',{type:'select',opts:['Low','Medium','High']}),{submit:'Log'});FORM.inc=o=>{S.incidents.unshift({id:uid('inc'),title:o.title+' (simulated)',svc:o.svc,sev:o.sev,status:'Open',at:now()});save();closeModal();rv()};
ACT.incAct=d=>{const i=S.incidents.find(x=>x.id===d.id);i.status=i.status==='Open'?'Monitoring':'Resolved';log('Incident '+i.status+': '+i.title);save();rv()};
V['operations/backups']=()=>ph('Backups','Simulated backup states')+tbl('bk2',['Job','Last run','Size','Status'],S.backups.map(b=>[`<b>${esc(b.name)}</b>`,fmtDT(b.at),b.size,badge(b.status,b.status==='Completed'?'ok':'warn')]),{search:false});
V['operations/alerts']=()=>ph('Service Alerts')+tbl('al',['Alert','Severity','State',''],S.alerts.map(a=>[esc(a.text),badge(a.sev),badge(a.ack?'Acknowledged':'Open',a.ack?'ok':'warn'),a.ack?'':btn('Acknowledge','ackAl',{id:a.id},'sm pri')]),{search:false});
ACT.ackAl=d=>{S.alerts.find(x=>x.id===d.id).ack=true;save();rv()};
V['operations/deploys']=()=>ph('Deployment History','Simulated release log')+tbl('dh',['Version','Type','Change','Result','Date'],S.deploys.map(d=>[`<b>${d.v}</b>`,d.type,esc(d.note),badge(d.status,d.status==='Passed'?'ok':'bad'),fmtD(d.at)]),{search:false});
V['operations/audit']=()=>ph('Access Audit Overview','Derived from demo sign-ins and actions')+tbl('au',['When','User','Role','Event'],S.logs.slice(0,40).map(l=>[fmtDT(l.at),esc(l.who),esc(l.role),esc(l.action)]));

/* ---------- permission guards & boot ---------- */
[['nApprove','Approve content'],['qAct','Approve content'],['pubTest','Manage exams'],['pubRes','Manage exams'],['newUser','Manage users'],['togUser','Manage users']].forEach(([k,p])=>{const f=ACT[k];ACT[k]=(...a)=>can(p)?f(...a):toast('Permission denied (simulated): your role lacks “'+p+'”','bad')});
['exam','user','onboard'].forEach(k=>{const f=FORM[k],p=k==='exam'?'Manage exams':'Manage users';FORM[k]=(...a)=>can(p)?f(...a):toast('Permission denied (simulated): your role lacks “'+p+'”','bad')});
function boot(){S=loadState();EX=loadExam();
 S.classes.forEach(c=>{if(c.recording==='Processing'&&(!c.endedAt||now()-c.endedAt>6000))c.recording='Available'});
 if(S.auth&&!(NAV[S.auth]||[]).some(n=>n[0]===S.route.view)&&!['liveroom','cbt'].includes(S.route.view))S.route={view:'dashboard',p:{}};
 if(S.route.view==='cbt'&&!(EX&&S.auth==='student'))S.route={view:'dashboard',p:{}};
 if(EX&&EX.endAt<=now()&&S.auth==='student'){finishExam(true);return}
 render()}
document.addEventListener('DOMContentLoaded',boot);

/* ===== Extension v3 (part 2): management hooks, guards, reset ===== */
const _mgmtDash=V['management/dashboard'];
V['management/dashboard']=p=>{const a=campAgg(S.camps),enr=S.leads.filter(l=>l.camp&&l.status==='Converted').length;
 return _mgmtDash(p)+`<div class="mt">${card('Marketing attribution '+'<span class="badge warn">Illustrative Demo Data</span>',`<div class="grid g4">${kpi('Campaign-attributed enrollments',enr,'Tracked internally','check')}${kpi('Attributed revenue',inr(a.rev),'Mock payments','dollar')}${kpi('Marketing spend',inr(a.spend),'Manual / imported','wallet')}${kpi('Return on ad spend',a.roas+'×','','chart')}</div><div class="mt">${btn('Open Campaign Manager','go',{v:'camp'},'sm pri','tag')}</div>`)}</div>`};
['campForm','campAct','campSim','adForm','adImport','adRun','execForm'].forEach(k=>{const f=ACT[k];ACT[k]=(d,...r)=>{if(!can('Manage campaigns')){toast('Access denied (simulated): requires “Manage campaigns”','bad');return}return f(d,...r)}});
['campaign','adMetrics','execs'].forEach(k=>{const f=FORM[k];FORM[k]=(...a)=>{if(!can('Manage campaigns')){toast('Access denied (simulated)','bad');return}return f(...a)}});
V['*/camp']=(f=>p=>can('Manage campaigns')?f(p):ph('Campaign Manager')+'<div class="note">Access denied (simulated): your role lacks “Manage campaigns”.</div>')(V['*/camp']);
V['marketing/dashboard']=p=>V['*/camp'](p);

</script></body></html>
